# ===========================================================================
# rungs test spec for zram-advisor  (AD-HOC file: no ~/.config/rungs copy)
# ===========================================================================
#
# Run it from this project root:
#
#     rungs ./TESTING.ini
#     # or from the rungs source checkout:
#     PYTHONPATH="$HOME/Projects/rungs/src" python3 -m rungs.main ./TESTING.ini
#
# The file holds one menu per topic; `rungs ./TESTING.ini` lists them:
#
#     install-uninstall   remove the previous install / install this tree
#     zram-advisor        the zram-advisor invocation forms
#     fix-zram            the fix-zram invocation forms
#
# Add -n/--dry-run to see every command without running anything.
#
# ===========================================================================
# HOW TO READ THIS SPEC
# ===========================================================================
# The FIRST line of every entry is its description; rungs shows it in the
# menu.  The prefix right after "::" gives the entry's level in the ladder:
#
#   ":: *<text>"        -> STATE-CHANGING (order matters; the '*' butts the
#                           text).  Run it before the "- CHK:" entries that
#                           depend on it.
#   "::  <text>"        -> RUNS the tool and checks it in one go (or is a
#                           VISUAL run).  Just run it; the verdict, if any,
#                           says whether it worked.
#   "::  - CHK: <text>" -> a CHECK.  Inspects existing state only (changes
#                           nothing).  It prints the raw evidence (ls,
#                           systemctl, zramctl, ...), states what to EXPECT,
#                           then a one-line verdict.  Safe to SKIP / sample.
#
# A verdict (the shared "verdict" helper defined in [__GLOBAL__]) is a blank
# line followed by, from $OK_MSG / $FAIL_MSG:
#     ✓✓✓✓✓✓✓✓✓✓ OK
# or
#     ✘✘✘✘✘✘✘✘✘✘ FAIL
# Grep a run for either marker to seed the automatic result.  (A "- CHK:"
# entry may depend on a preceding "*" entry; the checks do not depend on each
# other.)  These tokens are display-only conventions.
#
# NOTES
#   * rungs runs each command block through /bin/sh (POSIX sh): no bashisms.
#   * Everything here is safe to re-run (commands are idempotent).  Quit a
#     menu with 'x' whenever you have seen enough -- you don't have to finish
#     a section.
#   * Do NOT run the "*" removal entries in install-uninstall while you still
#     want the product installed.
#   * Checks stay terse via the shared "+PRE" helpers in [__GLOBAL__]: end a
#     check with "verdict", and report a failure with "bad MSG" / "die MSG".
# ===========================================================================

# Shared verdict strings AND helpers (rungs "+ENV" / "+PRE").  [__GLOBAL__]
# is hidden from the menu list and inherited by every section and sub-menu:
#   verdict  -> blank line + $OK_MSG, or $FAIL_MSG then exit 1
#   bad MSG  -> print "$FAIL_MSG: MSG" and set fail=1
#   die MSG  -> print "$FAIL_MSG: MSG" and exit 1
[__GLOBAL__]
+PRE: verdict() { if [ "$fail" -eq 0 ]; then echo; echo "$OK_MSG"; else echo; echo "$FAIL_MSG"; exit 1; fi; }
      bad()     { echo "$FAIL_MSG: $*"; fail=1; }
      die()     { echo "$FAIL_MSG: $*"; exit 1; }
+ENV: OK_MSG=✓✓✓✓✓✓✓✓✓✓ OK
      FAIL_MSG=✘✘✘✘✘✘✘✘✘✘ FAIL


# ---------------------------------------------------------------------------
# Topic: install / uninstall  (state-changing steps + state inspections)
# ---------------------------------------------------------------------------
[TEST-install-uninstall]

01: :: *Clean up the previous install (documented: fix-zram --unload/--unsetup, then pipx uninstall)
   echo '== Step 1: remove the previous zram-advisor install (documented procedure) =='
   # README "Removing zRAM Permanently": unload any running zRAM, remove the
   # service + installed script, then uninstall the package.  Each command
   # tolerates "never installed", so this works whether or not the previous
   # release was ever published.
   sudo /usr/local/bin/fix-zram --unload   || echo '   (no fix-zram installed: nothing to unload)'
   sudo /usr/local/bin/fix-zram --unsetup  || echo '   (no fix-zram installed: nothing to remove)'
   pipx uninstall zram-advisor             || echo '   (zram-advisor not installed in pipx)'
   echo '== Step 1 finished -- confirm with the ::  - CHK: checks below =='

02: ::  - CHK: no fix-zram service file and service not running. EXPECT: to see NEITHER
   echo '$ ls -l /etc/systemd/system/fix-zram.service'
   ls -l /etc/systemd/system/fix-zram.service 2>&1
   echo '$ systemctl status fix-zram.service --no-pager'
   systemctl status fix-zram.service --no-pager 2>&1 | head -n 6
   fail=0
   [ -e /etc/systemd/system/fix-zram.service ] && fail=1
   systemctl list-unit-files 2>/dev/null | grep -qi fix-zram && fail=1
   verdict

03: ::  - CHK: no installed fix-zram script, init wrapper, log, or /tmp residue. EXPECT: "No such file" for each
   echo '$ ls -l the installed/residual paths'
   ls -l /usr/local/bin/fix-zram 2>&1
   ls -l /etc/init.d/fix-zram-init 2>&1
   ls -l /var/log/fix-zram-init.log 2>&1
   ls -l /tmp/fix-zram.sh 2>&1
   fail=0
   for p in /usr/local/bin/fix-zram /etc/init.d/fix-zram-init /var/log/fix-zram-init.log /tmp/fix-zram.sh; do
   [ -e "$p" ] && fail=1
   done
   verdict

04: ::  - CHK: no zram-advisor in pipx/pip and no launcher symlink. EXPECT: no zram-advisor lines
   echo '$ pipx list | grep -i zram'
   pipx list 2>&1 | grep -i zram
   echo '$ python3 -m pip show zram-advisor (top 3 lines)'
   python3 -m pip show zram-advisor 2>&1 | head -n 3
   echo '$ ls -l ~/.local/bin/zram-advisor'
   ls -l "$HOME/.local/bin/zram-advisor" 2>&1
   fail=0
   pipx list 2>/dev/null | grep -qi zram-advisor && fail=1
   [ -e "$HOME/.local/bin/zram-advisor" ] && fail=1
   python3 -m pip show zram-advisor >/dev/null 2>&1 && fail=1
   verdict

05: ::  - CHK: no zRAM device, no zram swap entry, no loaded zram module. EXPECT: empty zramctl/swapon and no lsmod line
   echo '$ zramctl'
   zramctl 2>&1
   echo '$ swapon --show'
   swapon --show 2>&1
   echo '$ lsmod | grep -i zram'
   lsmod 2>&1 | grep -i zram
   fail=0
   zramctl 2>/dev/null | grep -q zram && fail=1
   swapon --show 2>/dev/null | grep -q zram && fail=1
   lsmod 2>/dev/null | grep -q '^zram' && fail=1
   verdict

06: :: *Install the version under development (from this working tree)
   echo '== Step 2: install zram-advisor from this working tree =='
   pipx install --force .
   echo '== Step 2 finished -- confirm with the ::  - CHK: check below =='

07: ::  - CHK: installed package matches this tree and console-window is pinned. EXPECT: same version and console-window 1.4.3
   VENV="$HOME/.local/share/pipx/venvs/zram-advisor"
   echo '$ pipx list | grep -i -A2 zram-advisor'
   pipx list 2>&1 | grep -i -A2 zram-advisor
   want=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
   echo "working tree version: $want"
   echo '$ installed metadata'
   "$VENV/bin/python" -c "import importlib.metadata as m; print('installed zram-advisor:', m.version('zram-advisor')); print('Requires:', m.requires('zram-advisor')); print('console-window:', m.version('console-window'))" 2>&1
   [ -x "$VENV/bin/python" ] || die "pipx venv python missing (did the install complete?)"
   fail=0
   got=$("$VENV/bin/python" -c "import importlib.metadata as m; print(m.version('zram-advisor'))")
   [ "$got" = "$want" ] || bad "installed $got != working tree $want"
   "$VENV/bin/python" -c "import importlib.metadata as m, sys; req=m.requires('zram-advisor') or []; print('console-window:', m.version('console-window')); sys.exit(0 if any('console-window==1.4.3' in r for r in req) else 1)" || bad 'console-window is not pinned to 1.4.3'
   verdict

x: exit


# ---------------------------------------------------------------------------
# Topic: the zram-advisor invocation forms
# ---------------------------------------------------------------------------
[TEST-zram-advisor]

01: ::  zram-advisor  (no args -- LIVE monitor; VISUAL, no assertion)
   printf '\npress RETURN to run zram-advisor; quit it when done.\n'
   read _
   zram-advisor

02: ::  zram-advisor --help lists the documented options. EXPECT: -s / -d / -t / -L,--load / -U,--unload / --DB
   echo '$ zram-advisor --help'
   zram-advisor --help 2>&1
   fail=0
   for opt in --setup-fix-zram --dump-fix-zram --gen-test-sites --load --unload --DB; do
   zram-advisor --help 2>&1 | grep -q -- "$opt" || bad "--help omits $opt"
   done
   verdict

03: ::  zram-advisor -d dumps a bash-syntax-valid fix-zram script. EXPECT: shebang and "SCRIPT SYNTAX OK"
   echo '$ zram-advisor -d | head -n 3'
   zram-advisor -d 2>&1 | head -n 3
   zram-advisor -d > /tmp/fix-zram-dump.sh 2>/dev/null
   echo '$ bash -n /tmp/fix-zram-dump.sh'
   bash -n /tmp/fix-zram-dump.sh && echo 'SCRIPT SYNTAX OK'
   fail=0
   [ "$(head -n 1 /tmp/fix-zram-dump.sh)" = '#!/bin/bash' ] || bad 'missing #!/bin/bash shebang'
   bash -n /tmp/fix-zram-dump.sh 2>/dev/null || bad 'bash -n rejected the dumped script'
   rm -f /tmp/fix-zram-dump.sh
   verdict

04: ::  zram-advisor -t emits one bookmark per site. EXPECT: bookmark count equals random-sites.txt line count
   echo '$ zram-advisor -t | head -n 6'
   zram-advisor -t 2>&1 | head -n 6
   got=$(zram-advisor -t 2>/dev/null | grep -c '<DT><A HREF="https://')
   want=$(grep -c . zram_advisor/random-sites.txt)
   echo "bookmarks=$got  sites=$want"
   fail=0
   [ "$got" = "$want" ] && [ "$want" -gt 0 ] || fail=1
   verdict

05: :: *zram-advisor --load 2x 12g  (loads zRAM, then the LIVE monitor; VISUAL, no assertion)
   printf '\npress RETURN to load zRAM and open the monitor; quit it when done.\n'
   read _
   zram-advisor --load 2x 12g

06: ::  - CHK: zRAM is loaded per the plan (after the '*zram-advisor --load'). EXPECT: zram0 ~12G zstd; swapon priority 100; vm swappiness 180 etc.
   echo '$ zramctl'
   zramctl 2>&1
   echo '$ swapon --show'
   swapon --show 2>&1
   echo '$ sysctl vm.swappiness vm.watermark_boost_factor vm.watermark_scale_factor vm.page-cluster'
   sysctl vm.swappiness vm.watermark_boost_factor vm.watermark_scale_factor vm.page-cluster 2>&1
   fail=0
   zramctl 2>/dev/null | grep -q zram || fail=1
   swapon --show 2>/dev/null | grep -q zram || fail=1
   verdict

07: :: *zram-advisor --unload  (unloads zRAM; prints one snapshot and exits)
   echo '== unload zRAM =='
   zram-advisor --unload

08: ::  - CHK: zRAM is unloaded (after the '*zram-advisor --unload'). EXPECT: empty zramctl and no zram swap
   echo '$ zramctl'
   zramctl 2>&1
   echo '$ swapon --show'
   swapon --show 2>&1
   fail=0
   zramctl 2>/dev/null | grep -q zram && fail=1
   swapon --show 2>/dev/null | grep -q zram && fail=1
   verdict

x: exit


# ---------------------------------------------------------------------------
# Topic: the fix-zram invocation forms  (fix-zram re-execs itself under sudo)
# ---------------------------------------------------------------------------
[TEST-fix-zram]

01: :: *zram-advisor --setup-fix-zram 2x 12g  (installs /usr/local/bin/fix-zram + boot service; required by the checks below)
   echo '== install fix-zram: zram-advisor --setup-fix-zram 2x 12g =='
   zram-advisor --setup-fix-zram 2x 12g

02: ::  fix-zram --help lists the usage. EXPECT: "USE: fix-zram", load/unload/setup/unsetup, swappiness (it self-elevates with sudo)
   echo '$ fix-zram --help'
   sudo /usr/local/bin/fix-zram --help 2>&1
   out=$(sudo /usr/local/bin/fix-zram --help 2>&1)
   fail=0
   echo "$out" | grep -q 'USE: fix-zram' || bad 'no "USE: fix-zram" line'
   for k in load unload setup unsetup swappiness; do
   echo "$out" | grep -q "$k" || bad "usage omits $k"
   done
   verdict

03: ::  fix-zram -n --load 2x 12g (dry-run) prints the plan only. EXPECT: "dry-run=yes" and "WOULD ++", no changes
   echo '$ fix-zram -n --load 2x 12g'
   out=$(sudo /usr/local/bin/fix-zram -n --load 2x 12g 2>&1)
   echo "$out"
   fail=0
   echo "$out" | grep -q 'dry-run=yes' || bad 'not in dry-run mode'
   echo "$out" | grep -q 'WOULD ++' || bad 'no "WOULD ++" lines'
   verdict

04: :: *fix-zram --reload 2x 12g  (real: (re)load zRAM now; the next check depends on it)
   echo '== fix-zram --reload 2x 12g =='
   sudo /usr/local/bin/fix-zram --reload 2x 12g

05: ::  - CHK: zRAM is loaded (after the '*fix-zram --reload'). EXPECT: zram0 ~12G zstd and priority 100
   echo '$ zramctl'
   zramctl 2>&1
   echo '$ swapon --show'
   swapon --show 2>&1
   fail=0
   zramctl 2>/dev/null | grep -q zram || fail=1
   swapon --show 2>/dev/null | grep -q zram || fail=1
   verdict

06: :: *fix-zram --unload  (real: unload zRAM now)
   echo '== fix-zram --unload =='
   sudo /usr/local/bin/fix-zram --unload

07: ::  - CHK: zRAM is unloaded (after the '*fix-zram --unload'). EXPECT: empty zramctl and no zram swap
   echo '$ zramctl'
   zramctl 2>&1
   echo '$ swapon --show'
   swapon --show 2>&1
   fail=0
   zramctl 2>/dev/null | grep -q zram && fail=1
   swapon --show 2>/dev/null | grep -q zram && fail=1
   verdict

08: ::  fix-zram -n --unsetup (dry-run) removes nothing. EXPECT: "WOULD ++" and /usr/local/bin/fix-zram still present
   echo '$ fix-zram -n --unsetup'
   sudo /usr/local/bin/fix-zram -n --unsetup 2>&1
   fail=0
   [ -e /usr/local/bin/fix-zram ] || bad 'dry-run removed /usr/local/bin/fix-zram'
   verdict

x: exit
